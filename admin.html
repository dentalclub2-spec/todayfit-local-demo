<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘도핏 — 로컬 데모 관리자 화면</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ec;color:#17352a;font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.7}main{max-width:1100px;margin:auto;padding:40px 6%}a{color:#226947}h1{font-size:clamp(25px,4vw,37px);letter-spacing:-1px}.warning{background:#fff0cd;border:1px solid #d5b166;border-radius:10px;padding:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:25px 0}button,select{font:inherit;padding:10px 15px;border:1px solid #7e9481;border-radius:6px;background:white;color:#17352a;cursor:pointer}button:hover{background:#e4ecdc}.danger{color:#a32923;border-color:#bf8d7e}.card{background:white;border:1px solid #d7dfd0;border-radius:12px;padding:24px;margin-bottom:20px}.card-header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.card-header h2{font-size:21px;margin:0}.status{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700}dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;margin:23px 0 0}dt{color:#65776a;font-size:14px}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.empty{text-align:center;padding:60px 20px;border:1px dashed #9daf98;border-radius:12px}.notice{padding:15px;border-radius:8px;white-space:pre-wrap}.notice:empty{display:none}.notice[data-kind=error]{background:#ffe8e2;color:#9c2820}.notice[data-kind=success]{background:#e0f0da}.id{font-size:11px;color:#68766a;overflow-wrap:anywhere}button:disabled,select:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #b36e1e;outline-offset:4px}@media(max-width:600px){main{padding:24px 6%}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:12px}.card{padding:20px}.status{width:100%;justify-content:space-between}}main{max-width:1160px}h1{margin:24px 0}.warning{border:0;border-radius:0;background:#e3e9dd}.card{border:0;border-radius:0}.empty{border:0;background:#e3e9dd}.notice{border-radius:0}button,select{border-radius:0}body{background:#f1f3ee}.toolbar{margin:32px 0}button{min-height:46px}</style></head><body><main><a href="index.html">← 오늘도핏 랜딩페이지</a><h1>로컬 데모 관리자 화면</h1><aside class="warning"><strong>로그인이나 서버 보안이 없는 실습 화면입니다.</strong><br>실습용 가상 데이터만 사용하세요. 같은 브라우저·같은 주소의 localStorage만 읽으며 다른 기기와 공유되지 않습니다. 실제 문의 접수나 상담 연락 기능은 없습니다.</aside><div class="toolbar"><strong id="count">문의 목록</strong><div><button id="refresh">목록 새로고침</button> <button id="delete" class="danger">시연 데이터 전체 삭제</button></div></div><div id="notice" class="notice" role="status" aria-live="polite"></div><section id="list" aria-label="문의 목록"></section></main><script>
'use strict';const KEY='todayfit_inquiries_v1',list=document.getElementById('list'),notice=document.getElementById('notice');
function announce(text,kind){notice.textContent=text;notice.dataset.kind=kind;}
function readInquiries(){const raw=localStorage.getItem(KEY);if(raw===null)return [];const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(x=>x&&typeof x.id==='string'&&typeof x.createdAt==='string'&&Number.isFinite(Date.parse(x.createdAt))&&['name','phone','program','preferredTime','message'].every(k=>typeof x[k]==='string')&&x.consent===true&&['새 문의','연락 완료'].includes(x.status)))throw new Error('저장 데이터 형식 오류');return data;}
function node(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function render(){list.replaceChildren();let data;try{data=readInquiries();}catch(e){document.getElementById('count').textContent='문의 목록 조회 실패';announce('문의 데이터를 읽을 수 없습니다. 브라우저 저장소 접근 또는 JSON 데이터 형식을 확인해 주세요. 원본 데이터는 수정하지 않았습니다.','error');return;}document.getElementById('count').textContent='전체 문의 '+data.length+'건 · 최신순';if(!data.length){list.append(node('p','아직 접수된 문의가 없습니다. 랜딩페이지에서 가상 문의를 남겨 보세요.','empty'));return;}data.sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));for(const entry of data){const card=node('article',undefined,'card'),header=node('div',undefined,'card-header');header.append(node('h2',entry.name));const control=node('div',undefined,'status'),label=node('label','처리 상태'),select=node('select');select.id='status-'+entry.id;label.htmlFor=select.id;select.setAttribute('aria-label',entry.name+' 문의 처리 상태');for(const status of ['새 문의','연락 완료']){const option=node('option',status);option.value=status;select.append(option);}select.value=entry.status;select.addEventListener('change',()=>{const next=select.value;select.disabled=true;try{const latest=readInquiries(),target=latest.find(x=>x.id===entry.id);if(!target)throw new Error('문의가 존재하지 않습니다');target.status=next;localStorage.setItem(KEY,JSON.stringify(latest));if(readInquiries().find(x=>x.id===entry.id)?.status!==next)throw new Error('저장 확인 실패');entry.status=next;announce(entry.name+' 문의 상태를 ‘'+next+'’로 저장했습니다.','success');}catch(e){select.value=entry.status;announce('상태를 저장하지 못했습니다. 기존 표시로 되돌렸습니다. 저장소를 확인한 뒤 목록을 새로고침하고 다시 시도해 주세요.','error');}finally{select.disabled=false;}});control.append(label,select);header.append(control);card.append(header);const dl=node('dl');for(const [title,value] of [['접수 시각',new Date(entry.createdAt).toLocaleString('ko-KR')],['연락처',entry.phone],['관심 프로그램',entry.program],['상담 희망 시간',entry.preferredTime||'입력 없음'],['문의 내용',entry.message||'입력 없음']])dl.append(node('dt',title),node('dd',value));card.append(dl,node('p','접수번호: '+entry.id,'id'));list.append(card);}}
document.getElementById('refresh').addEventListener('click',()=>{announce('','success');render();});document.getElementById('delete').addEventListener('click',()=>{if(!confirm('이 브라우저의 오늘도핏 실습 문의를 모두 삭제할까요?'))return;try{localStorage.removeItem(KEY);render();announce('시연 데이터를 삭제했습니다.','success');}catch(e){announce('데이터를 삭제하지 못했습니다. 브라우저 저장소 설정을 확인해 주세요.','error');}});window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){announce('','success');render();}});render();
</script></body></html>
